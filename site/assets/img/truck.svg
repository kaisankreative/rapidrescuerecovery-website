  <g class="wheels">
    <g transform="translate(110 226)"><circle r="30" fill="#0B0D11"/><circle r="14" fill="#8A93A3"/><circle r="5" fill="#0B0D11"/></g>
    <g transform="translate(178 226)"><circle r="30" fill="#0B0D11"/><circle r="14" fill="#8A93A3"/><circle r="5" fill="#0B0D11"/></g>
    <g transform="translate(524 226)"><circle r="30" fill="#0B0D11"/><circle r="14" fill="#8A93A3"/><circle r="5" fill="#0B0D11"/></g>
