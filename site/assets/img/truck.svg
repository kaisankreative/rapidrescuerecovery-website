<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" class="truck-svg" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB000" stop-opacity=".9"/><stop offset="1" stop-color="#FFB000" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FB4C8"/><stop offset="1" stop-color="#4E6175"/></linearGradient>
    <linearGradient id="carbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B6678"/><stop offset="1" stop-color="#2E3542"/></linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="320" cy="262" rx="290" ry="10" fill="#000" opacity=".35"/>
  <!-- bed / chassis -->
  <rect x="34" y="176" width="400" height="16" rx="3" fill="#C9CED6"/>
  <rect x="34" y="192" width="400" height="20" rx="2" fill="#1C2028"/>
  <path d="M34 176 L14 196 L34 196Z" fill="#C9CED6"/>
  <rect x="40" y="182" width="388" height="5" fill="#FFB000"/>
