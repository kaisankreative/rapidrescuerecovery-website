    <path d="M160 130 C176 114 196 108 226 108 L234 108 L234 130Z" fill="url(#glass)"/>
    <path d="M244 108 L280 108 C298 108 312 118 324 130 L244 130Z" fill="url(#glass)"/>
    <rect x="236" y="106" width="6" height="26" fill="#2E3542"/>
    <rect x="372" y="142" width="16" height="7" rx="3" fill="#FFE7A3"/>
    <rect x="72" y="146" width="12" height="8" rx="2" fill="#E1261C"/>
    <g fill="#0B0D11"><circle cx="128" cy="172" r="22"/><circle cx="330" cy="172" r="22"/></g>
    <g fill="#7B8494"><circle cx="128" cy="172" r="10"/><circle cx="330" cy="172" r="10"/></g>
    <!-- straps -->
    <path d="M118 178 L104 192 M138 178 L152 192 M320 178 L306 192 M340 178 L354 192" stroke="#FFB000" stroke-width="3"/>
  </g>
  <!-- cab -->
  <path d="M434 104 Q434 96 442 96 L540 96 C556 96 564 102 570 116 L596 176 C600 184 602 192 602 200 L602 222 L434 222Z" fill="#F2F3F5"/>
  <path d="M532 108 L556 108 C562 108 566 112 568 117 L588 164 L532 164Z" fill="url(#glass)"/>
  <rect x="452" y="108" width="66" height="40" rx="6" fill="url(#glass)" opacity=".9"/><rect x="598" y="128" width="6" height="22" rx="2" fill="#1C2028"/>
  <rect x="434" y="186" width="168" height="10" fill="#FFB000"/>
  <rect x="586" y="200" width="18" height="10" rx="2" fill="#FFE7A3"/>
  <rect x="434" y="210" width="170" height="14" rx="3" fill="#1C2028"/>
