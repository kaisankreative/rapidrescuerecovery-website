  <g transform="translate(470 156) scale(.42)"><rect width="64" height="64" rx="14" fill="#FFB000"/><g fill="none" stroke="#0E1116" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(32 32) skewX(-12) translate(-29.5 -32)"><path d="M20 51 V13 H33 a9.5 9.5 0 0 1 0 19 H20"/><path d="M33 32 V42 a6 6 0 0 0 12 0 V39"/></g></g>
